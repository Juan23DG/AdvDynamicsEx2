<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found • Advanced Dynamics Exam 2 Study Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2.4" />
  <link rel="stylesheet" href="css/styles.css?v=2.4" />
  <style>
    .notfound-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      background: var(--bg-main);
    }
    .notfound-card {
      max-width: 540px;
      padding: 2.5rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    .notfound-code {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 0.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .notfound-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    .notfound-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="notfound-container">
    <div class="notfound-card">
      <div class="notfound-code">404</div>
      <h1 class="notfound-title">Page Not Found</h1>
      <p class="notfound-desc">
        The requested URL was not found on the Advanced Dynamics Exam 2 Study Studio.
        Click below to return to the interactive guided study modules.
      </p>
      <a href="/" class="btn btn-primary" style="padding: 0.65rem 1.4rem; font-size: 0.92rem; font-weight: 700; text-decoration: none;">
        🏠 Return to Exam 2 Study Studio
      </a>
    </div>
  </main>
</body>
</html>
